# arenakvd configuration example. Names are the long command-line options without the dashes; command-line
# options override this file. See docs/OPERATIONS.md.

# Native protocol (rdmaduct): RDMA when a device exists, TCP otherwise.
transport = auto
port = 7600
# addr = 192.0.2.10        # address of the RDMA interface

# Text protocols
memcached-port = 11211
resp-port = 6379
text-addr = 127.0.0.1

# Engine
capacity = 4G
max-entry = 1M
# no-evict                 # refuse stores when full instead of evicting

# Server
# threads = 8              # default: online CPUs
max-conns = 10000
idle-timeout = 3600
# auth-file = /etc/arenakv/credentials

# Persistence
# snapshot = /var/lib/arenakv/arenakv.snap
# save-interval = 300

log-level = info
