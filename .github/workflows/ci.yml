name: ci
on:
  push:
  pull_request:

jobs:
  build-test-tcp:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential clang clang-format
      - name: Format check
        if: matrix.cc == 'gcc' && matrix.os == 'ubuntu-24.04'
        run: make format-check
      - name: Build and test without RDMA
        run: make test-tcp
      - name: Hardening of the executables
        run: >-
          scripts/check_hardening.sh arenakv/build/*-tcp/arenakvd arenakv/build/*-tcp/akv_cli
          kvpace/build/*-tcp/kvpace rdmaduct/build/*-tcp/hello_server

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: for p in rdmaduct arenakv kvpace; do make -C $p RDMA=0 SAN=1 test || exit 1; done

  tls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - name: rdmaduct encrypted endpoints, plain and under the sanitizers
        run: make -C rdmaduct RDMA=0 TLS=1 test && make -C rdmaduct RDMA=0 TLS=1 SAN=1 test
      - name: arenakv with TLS listeners, plain and under the sanitizers
        run: make -C arenakv RDMA=0 TLS=1 test && make -C arenakv RDMA=0 TLS=1 SAN=1 test
      - name: kvpace with TLS for the text drivers, plain and under the sanitizers
        run: make -C kvpace RDMA=0 TLS=1 test && make -C kvpace RDMA=0 TLS=1 SAN=1 test

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: arenakv engine and server under ThreadSanitizer
        run: make -C arenakv RDMA=0 TSAN=1 test

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cppcheck libibverbs-dev librdmacm-dev libssl-dev
      - name: clang static analyzer and cppcheck, no findings allowed
        run: make analyze

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: Every libFuzzer harness for 60 seconds under AddressSanitizer and UndefinedBehaviorSanitizer
        run: make fuzz FUZZ_TIME=60
      - name: Keep the inputs of a failing harness
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            arenakv/build/fuzz/*-crash-*
            arenakv/build/fuzz/*-leak-*
            arenakv/build/fuzz/*-timeout-*
            rdmaduct/build/fuzz/*-crash-*
            rdmaduct/build/fuzz/*-leak-*
            rdmaduct/build/fuzz/*-timeout-*

  client-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3-redis
      - name: valkey-cli, valkey-benchmark, memtier_benchmark and redis-py against arenakvd
        run: make -C arenakv RDMA=0 compat

  rdma-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential libibverbs-dev librdmacm-dev
      - name: Compile with RDMA support (RDMA suites need a device and run elsewhere)
        run: make
      - name: Compile the lab programs with warnings as errors
        run: make -C lab clean all CFLAGS="-O2 -g -Wall -Wextra -Wno-unused-parameter -std=gnu11 -Werror"

  benchmark-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-matplotlib
      - name: Verify figures, tables and claims against the raw data
        run: make verify
